[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ouroboros"
version = "0.5.0"
description = "Auditable local model adaptation, weight editing, and bounded self-improvement experiments"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{name = "Ouroboros contributors"}]
dependencies = ["numpy>=1.24,<3", "PyYAML>=6,<7", "safetensors>=0.4,<1"]

[project.optional-dependencies]
llm = ["torch>=2.2,<3", "transformers>=4.46,<5", "accelerate>=1,<2", "huggingface-hub>=0.26,<1"]
mcp = ["mcp>=1.20,<2"]
math = ["math-verify==0.9.0"]
structured = ["lm-format-enforcer==0.11.3"]
smoke = ["gguf>=0.19,<1"]
train = ["torch>=2.2,<3", "transformers>=4.46,<5", "peft>=0.14,<1", "accelerate>=1,<2", "safetensors>=0.4,<1"]
quantization = ["bitsandbytes>=0.45,<1"]
preference = ["trl>=0.15,<1", "datasets>=3,<5"]
dev = ["pytest>=8,<10", "ruff>=0.8,<1", "build>=1,<2"]

[project.scripts]
ouroboros = "ouroboros.cli:main"
ouroboros-mcp = "ouroboros.mcp_server:main"

[project.urls]
Repository = "https://github.com/Mr-Nobody-Anonymous/ouroboros"

[tool.setuptools.packages.find]
include = ["ouroboros*"]
exclude = ["external*", "tests*"]

[tool.setuptools.package-data]
"ouroboros.resources" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "ml: optional Torch/direct-edit and local Transformers/PEFT integration tests (no downloads)",
    "mcp: optional real MCP SDK and stdio protocol integration tests",
]

[tool.ruff]
line-length = 100
target-version = "py310"
include = ["ouroboros/**/*.py", "tests/**/*.py", "scripts/**/*.py"]
exclude = ["external", ".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
