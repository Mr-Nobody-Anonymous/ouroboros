name: Core, MCP and real-model tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q -m 'not ml'
      - run: ruff check ouroboros tests scripts
      - run: ruff format --check ouroboros tests scripts
      - run: python scripts/check_docs.py
      - run: ouroboros run --config examples/local_sft.json --check-only
      - run: ouroboros weights trial --config examples/weight_trial.json --check-only
      - run: ouroboros lab tools
      - run: python -m pip check
      - run: python -m build
  local-lora:
    runs-on: ubuntu-latest
    env:
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[dev,train,math,structured]' -c constraints/ml-tested.txt
      - run: python -m pytest -q -m ml
      - run: python -m pytest -q tests/test_lab_config_metrics.py
        env:
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
  mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev,mcp]' -c constraints/ml-tested.txt
      - run: python -m pytest -q -m mcp
      - run: python -m pip check
  pretrained-self-edit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[llm,smoke,structured]' -c constraints/ml-tested.txt
      # Explicit GitHub-only, pinned/hash-checked pretrained data; no upstream plugin execution.
      - run: python scripts/run_pretrained_smoke.py --workdir outputs/pretrained-smoke --fetch
      # Same receipt-verified model, but model-authored JSON attempts and scripted tool integration are labelled separately.
      - run: python scripts/run_research_smoke.py --workdir outputs/research-smoke --model-dir outputs/pretrained-smoke/models/smollm2
      # Fixed arithmetic/copy practice, adequate answer budget, actual schema-constrained commands.
      # A/B is registered first; no script fallback and no gain required for a passing test.
      - run: python scripts/run_research_experiment.py --workdir outputs/research-interface --model-dir outputs/pretrained-smoke/models/smollm2 --compare-unconstrained --turns 8 --max-seconds 240
      - run: python -m pip check
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: pretrained-self-edit-evidence
          path: |
            outputs/pretrained-smoke/pretrained_summary.json
            outputs/pretrained-smoke/outputs/self-edit/*/self_edit.json
            outputs/pretrained-smoke/models/smollm2/ouroboros_model.json
            outputs/research-interface/interface_plan.json
            outputs/research-interface/experiment_summary.json
            outputs/research-interface/outputs/*/*/lab.json
            outputs/research-smoke/research_summary.json
            outputs/research-smoke/outputs/*/*/lab.json
          if-no-files-found: warn
