name: Core, MCP and real-model tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  discovery-scope:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.scope.outputs.changed }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - id: scope
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          # If the comparison is unavailable, run conservatively. Docs-only follow-ups
          # do not repeat a two-checkpoint study; all ordinary CI still runs.
          changed=true
          if git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            if git diff --quiet "$BEFORE" "$GITHUB_SHA" -- ouroboros pyproject.toml constraints .github/workflows/ci.yml scripts/run_discovery_experiment.py scripts/prepare_discovery_data.py; then
              changed=false
            fi
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q -m 'not ml'
      - run: ruff check ouroboros tests scripts
      - run: ruff format --check ouroboros tests scripts
      - run: python scripts/check_docs.py
      - run: ouroboros run --config examples/local_sft.json --check-only
      - run: ouroboros weights trial --config examples/weight_trial.json --check-only
      - run: ouroboros lab tools
      - run: ouroboros lab tools --discovery
      - run: ouroboros lab experiment --model-dir missing --workdir outputs/check-only --check-only
      # Dependency-light foundation catalogue and source-linked DeepSeek matrix. Exits 2 if a
      # cited local evidence path is missing, so documentation drift fails CI.
      - run: ouroboros research tools
      - run: ouroboros research deepseek
      - run: python -m pip check
      - run: python -m build
  local-lora:
    runs-on: ubuntu-latest
    env:
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[dev,train,math,structured]' -c constraints/ml-tested.txt
      - run: python -m pytest -q -m ml
      # Real offline CPU foundation loop: audited SFT, fresh-worker gates, watchdogs.
      - run: python -m pytest -q tests/test_research_foundation_ml.py
      - run: python -m pytest -q tests/test_lab_config_metrics.py
        env:
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
  mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev,mcp]' -c constraints/ml-tested.txt
      - run: python -m pytest -q -m mcp
      - run: python -m pip check
  pretrained-self-edit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[llm,smoke,structured]' -c constraints/ml-tested.txt
      # Explicit GitHub-only, pinned/hash-checked pretrained data; no upstream plugin execution.
      - run: python scripts/run_pretrained_smoke.py --workdir outputs/pretrained-smoke --fetch
      # Same receipt-verified model, but model-authored JSON attempts and scripted tool integration are labelled separately.
      - run: python scripts/run_research_smoke.py --workdir outputs/research-smoke --model-dir outputs/pretrained-smoke/models/smollm2
      # Fixed arithmetic/copy practice, adequate answer budget, actual schema-constrained commands.
      # A/B is registered first; no script fallback and no gain required for a passing test.
      - run: python scripts/run_research_experiment.py --workdir outputs/research-interface --model-dir outputs/pretrained-smoke/models/smollm2 --compare-unconstrained --turns 8 --max-seconds 240
      - run: python -m pip check
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: pretrained-self-edit-evidence
          path: |
            outputs/pretrained-smoke/pretrained_summary.json
            outputs/pretrained-smoke/outputs/self-edit/*/self_edit.json
            outputs/pretrained-smoke/models/smollm2/ouroboros_model.json
            outputs/research-interface/interface_plan.json
            outputs/research-interface/experiment_summary.json
            outputs/research-interface/outputs/*/*/lab.json
            outputs/research-smoke/research_summary.json
            outputs/research-smoke/outputs/*/*/lab.json
          if-no-files-found: warn
  pretrained-discovery-360m:
    # Avoid duplicate PR and docs-only runs. A missing comparison runs conservatively.
    # Every PR still runs all protocol tests and the separate 135M job.
    needs: discovery-scope
    if: github.event_name == 'push' && needs.discovery-scope.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        seed: [17, 42]
    env:
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_XET: '1'
      HF_HUB_DOWNLOAD_TIMEOUT: '60'
      HF_HUB_ETAG_TIMEOUT: '60'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      MALLOC_ARENA_MAX: '2'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[llm,structured]' -c constraints/ml-tested.txt
      # Explicit public data-only provisioning. Resolve and hash the checkpoint BEFORE
      # preregistration/inference; receipt contains the exact immutable revision and files.
      - name: Provision official 360M Instruct checkpoint
        run: ouroboros models fetch --repo HuggingFaceTB/SmolLM2-360M-Instruct --directory models/smollm2-360m --max-bytes 2147483648
        env:
          HF_HUB_OFFLINE: '0'
          TRANSFORMERS_OFFLINE: '0'
      # Two fixed seeds, all controls/ablations, strict unchanged accuracy/retention gates.
      # A null result passes integrity CI, NEVER the scientific useful-edit milestone.
      - name: Closed-loop controls and autonomous discovery attempts
        run: ouroboros lab experiment --model-dir models/smollm2-360m --workdir outputs/discovery-360m-${{ matrix.seed }} --profile 360m --seeds ${{ matrix.seed }}
      - run: python -m pip check
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: discovery-360m-evidence-${{ matrix.seed }}
          path: outputs/discovery-360m-${{ matrix.seed }}/**/*.json
          if-no-files-found: warn
