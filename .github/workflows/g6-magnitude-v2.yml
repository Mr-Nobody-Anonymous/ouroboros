name: G6 magnitude_v2 fresh replay

on:
  push:
    branches:
      - arena/4dd3ddb6-ouroboros
    paths:
      - .github/workflows/g6-magnitude-v2.yml
      - scripts/run_selection_campaign.py
      - tests/test_research_dataset_selection.py
  workflow_dispatch:
    inputs:
      first_seed:
        description: First seed of a fresh 20-episode block; consumed G6 ranges are refused
        required: false
        default: '721'
        type: string
      report_run_id:
        description: Download and report a completed G6 artifact without rerunning the campaign
        required: false
        default: ''
        type: string
      report_first_seed:
        description: 'Report-only metadata: first source seed; not verified against episode manifests'
        required: false
        default: '701'
        type: string

permissions:
  contents: read

jobs:
  magnitude-v2-replay:
    if: ${{ !(github.event_name == 'push' && contains(github.event.head_commit.message, '[g6-report-only]')) && (github.event_name != 'workflow_dispatch' || inputs.report_run_id == '') }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      MALLOC_ARENA_MAX: '2'
      G6_FIRST_SEED: ${{ github.event.inputs.first_seed || '721' }}
      G6_WORKDIR: outputs/g6-magnitude-v2
      G6_LOG: outputs/g6-magnitude-v2-campaign.log
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install the pinned CPU ML stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev,llm,train,smoke]' -c constraints/ml-tested.txt
      - name: Verify frozen design and fresh-seed safeguards
        run: |
          python -m pytest -q tests/test_research_dataset_selection.py
          python -m pytest -q tests/test_research_foundation.py::test_magnitude_selection_design_is_new_and_discriminating
      - name: Provision and verify the pinned pretrained smoke model
        run: |
          mkdir -p outputs
          ouroboros models fetch-smoke --directory models/smollm2
          ouroboros models verify --directory models/smollm2 > outputs/g6-model-receipt.json
      - name: Run 20 fresh magnitude_v2 episodes and frozen replay
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$G6_FIRST_SEED" =~ ^[0-9]+$ ]]; then
            echo "first_seed must be a nonnegative integer" >&2
            exit 2
          fi
          first_seed=$((10#$G6_FIRST_SEED))
          last_seed=$((first_seed + 19))
          echo "## G6 magnitude_v2 fresh replay" >> "$GITHUB_STEP_SUMMARY"
          echo "- Fresh seed block: ${first_seed}–${last_seed}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Model: pinned SmolLM2-135M Q4_1-derived float32 smoke checkpoint" >> "$GITHUB_STEP_SUMMARY"
          echo "- Design SHA-256: f166076cfc02432e604bf089056006da3e2589c7425df42fa8f19afb9caa43e5 (enforced by campaign script)" >> "$GITHUB_STEP_SUMMARY"
          mkdir -p outputs
          python scripts/run_selection_campaign.py \
            --workdir "$G6_WORKDIR" \
            --episodes 20 \
            --first-seed "$first_seed" \
            --model models/smollm2 \
            --design magnitude_v2 \
            --analyse \
            --batch 7 2>&1 | tee "$G6_LOG"
      - name: Add measured replay summary
        if: always()
        run: |
          if [[ -f "$G6_WORKDIR/selection_result.json" ]]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          from pathlib import Path
          result = json.loads((Path(os.environ["G6_WORKDIR"]) / "selection_result.json").read_text())
          contrast = result.get("primary_minus_null", {})
          print(f"\n- Design SHA-256: `{result.get('design_sha256')}`")
          print(f"- Logged episodes: {result.get('episodes')}")
          print(f"- Decision: **{result.get('decision')}**")
          print(f"- Primary-minus-null median: {contrast.get('median_difference')}")
          method = contrast.get("method", "unknown")
          label = "exact" if method == "exact-problem-sign-flips" else "Monte Carlo"
          print(f"- Sign-flip p-value ({label}; {method}): {contrast.get('p_value')}")
          print(f"- Better / worse / ties: {contrast.get('episodes_primary_better')} / {contrast.get('episodes_null_better')} / {contrast.get('ties')}")
          print("\nThis is an offline selection-policy replay, not evidence of autonomous improvement or general capability.")
          PY
          else
            echo "\nNo complete replay result was produced; inspect the campaign log and partial evidence artifact." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: g6-magnitude-v2-evidence-${{ github.run_id }}
          path: |
            outputs/g6-model-receipt.json
            outputs/g6-magnitude-v2-campaign.log
            outputs/g6-magnitude-v2/selection_result.json
            outputs/g6-magnitude-v2/selection_design_predeclared.json
            outputs/g6-magnitude-v2/selection/selection_design_magnitude.json
            outputs/g6-magnitude-v2/experiments.sqlite3
            outputs/g6-magnitude-v2/episode-*/foundation.json
            outputs/g6-magnitude-v2/episode-*/manifest.json
            outputs/g6-magnitude-v2/runs/**/research.json
          if-no-files-found: warn
          retention-days: 90

  report-result:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.report_run_id != '' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      checks: write
      contents: read
    steps:
      - name: Download completed replay evidence
        uses: actions/download-artifact@v6
        with:
          name: g6-magnitude-v2-evidence-${{ inputs.report_run_id }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.report_run_id }}
          github-token: ${{ github.token }}
          path: outputs/g6-magnitude-v2-artifact
      - name: Publish measured summary to the pull request
        uses: actions/github-script@v7
        env:
          SOURCE_RUN_ID: ${{ inputs.report_run_id }}
          SOURCE_FIRST_SEED: ${{ inputs.report_first_seed }}
        with:
          script: |
            const fs = require("fs");
            const path = require("path");
            const runId = Number(process.env.SOURCE_RUN_ID);
            if (!Number.isSafeInteger(runId) || runId <= 0) {
              throw new Error("report_run_id must be a positive integer");
            }
            const root = path.resolve("outputs/g6-magnitude-v2-artifact");
            function locateAll(dir, filename, found = []) {
              for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
                const full = path.join(dir, entry.name);
                if (entry.isFile() && entry.name === filename) found.push(full);
                if (entry.isDirectory()) locateAll(full, filename, found);
              }
              return found;
            }
            const resultFiles = locateAll(root, "selection_result.json");
            if (resultFiles.length !== 1) throw new Error("Artifact must contain one selection_result.json");
            const result = JSON.parse(fs.readFileSync(resultFiles[0], "utf8"));
            const expectedHash = "f166076cfc02432e604bf089056006da3e2589c7425df42fa8f19afb9caa43e5";
            if (result.design_sha256 !== expectedHash) throw new Error("Artifact design hash mismatch");
            if (result.episodes !== 20 || result.episodes_logged !== 20) {
              throw new Error("Artifact does not contain 20 complete logged episodes");
            }
            const firstSeed = Number(process.env.SOURCE_FIRST_SEED);
            if (!Number.isSafeInteger(firstSeed) || firstSeed < 0) {
              throw new Error("report_first_seed must be a nonnegative integer");
            }
            const lastSeed = firstSeed + 19;
            if ([[201, 220], [601, 620]].some(([first, last]) => firstSeed <= last && lastSeed >= first)) {
              throw new Error("Reported source seeds overlap a known consumed range");
            }
            const { owner, repo } = context.repo;
            const source = await github.rest.actions.getWorkflowRun({ owner, repo, run_id: runId });
            if (source.data.conclusion !== "success") {
              throw new Error(`Source run ${runId} did not complete successfully`);
            }
            if (source.data.head_branch !== "arena/4dd3ddb6-ouroboros") {
              throw new Error("Source run is not from the active campaign branch");
            }
            const contrast = result.primary_minus_null;
            const means = Object.entries(result.mean_by_policy || {})
              .map(([policy, value]) => `${policy}=${Number(value).toFixed(4)}`)
              .join(", ");
            const body = [
              `<!-- g6-magnitude-v2-source-run:${runId} -->`,
              "## G6 magnitude_v2 fresh replay result",
              "",
              `- Source: [GitHub Actions run #${runId}](${source.data.html_url})`,
              `- Commit: \`${source.data.head_sha}\``,
              `- Fresh episodes: **20** (reported seeds ${firstSeed}–${lastSeed}; report seed metadata was not cross-checked against episode manifests; complete candidate sets logged)`,
              "- Model: pinned SmolLM2-135M-Instruct smoke checkpoint (receipt is in the run artifact)",
              `- Frozen design SHA-256: \`${result.design_sha256}\``,
              `- Mean practice delta by policy: ${means}`,
              `- Primary vs null: \`${contrast.primary}\` vs \`${contrast.null}\`; mean difference \`${Number(contrast.mean_difference).toFixed(4)}\`, median \`${Number(contrast.median_difference).toFixed(4)}\`.`,
              `- Primary better / null better / ties: **${contrast.episodes_primary_better} / ${contrast.episodes_null_better} / ${contrast.ties}**.`,
              `- Sign-flip p-value: \`${contrast.p_value}\` (\`${contrast.method}\`); decision: **${result.decision}**.`,
              `- Frozen rule: noise floor ${result.design.noise_floor}, one-sided sign-flip test with positive-median requirement.`,
              "",
              "This is an offline replay of recorded counterfactual candidates, not online learning or general capability evidence. `autonomous_improvement_demonstrated` remains false.",
              "The complete JSON, campaign log, per-episode manifests and model receipt are attached to the Actions run artifact."
            ].join("\n");
            const now = new Date().toISOString();
            const externalId = `g6-magnitude-v2-source-run:${runId}`;
            const output = {
              title: "Completed 20-episode magnitude_v2 replay",
              summary: body,
              text: `Source workflow run ${runId}; offline replay only.`
            };
            const checks = await github.paginate(github.rest.checks.listForRef, {
              owner, repo, ref: source.data.head_sha, filter: "all", per_page: 100
            });
            const existing = checks.find(check => check.external_id === externalId);
            let report;
            if (existing) {
              report = await github.rest.checks.update({
                owner, repo, check_run_id: existing.id,
                details_url: source.data.html_url,
                status: "completed", conclusion: "success", completed_at: now, output
              });
            } else {
              report = await github.rest.checks.create({
                owner, repo, name: "G6 magnitude_v2 replay result",
                head_sha: source.data.head_sha, external_id: externalId,
                details_url: source.data.html_url,
                status: "completed", conclusion: "success",
                started_at: now, completed_at: now, output
              });
            }
            await core.summary.addRaw(body).write();
            core.info(`Published measured G6 result as check run ${report.data.id}.`);
