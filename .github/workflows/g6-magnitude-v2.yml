name: G6 magnitude_v2 fresh replay

on:
  push:
    branches:
      - arena/4dd3ddb6-ouroboros
    paths:
      - .github/workflows/g6-magnitude-v2.yml
      - scripts/run_selection_campaign.py
      - tests/test_research_dataset_selection.py
  workflow_dispatch:
    inputs:
      first_seed:
        description: First seed of a fresh 20-episode block; consumed G6 ranges are refused
        required: false
        default: '701'
        type: string

permissions:
  contents: read

jobs:
  magnitude-v2-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      MALLOC_ARENA_MAX: '2'
      G6_FIRST_SEED: ${{ github.event.inputs.first_seed || '701' }}
      G6_WORKDIR: outputs/g6-magnitude-v2
      G6_LOG: outputs/g6-magnitude-v2-campaign.log
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install the pinned CPU ML stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev,llm,train,smoke]' -c constraints/ml-tested.txt
      - name: Verify frozen design and fresh-seed safeguards
        run: |
          python -m pytest -q tests/test_research_dataset_selection.py
          python -m pytest -q tests/test_research_foundation.py::test_magnitude_selection_design_is_new_and_discriminating
      - name: Provision and verify the pinned pretrained smoke model
        run: |
          mkdir -p outputs
          ouroboros models fetch-smoke --directory models/smollm2
          ouroboros models verify --directory models/smollm2 > outputs/g6-model-receipt.json
      - name: Run 20 fresh magnitude_v2 episodes and frozen replay
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$G6_FIRST_SEED" =~ ^[0-9]+$ ]]; then
            echo "first_seed must be a nonnegative integer" >&2
            exit 2
          fi
          first_seed=$((10#$G6_FIRST_SEED))
          last_seed=$((first_seed + 19))
          echo "## G6 magnitude_v2 fresh replay" >> "$GITHUB_STEP_SUMMARY"
          echo "- Fresh seed block: ${first_seed}–${last_seed}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Model: pinned SmolLM2-135M Q4_1-derived float32 smoke checkpoint" >> "$GITHUB_STEP_SUMMARY"
          echo "- Design SHA-256: f166076cfc02432e604bf089056006da3e2589c7425df42fa8f19afb9caa43e5 (enforced by campaign script)" >> "$GITHUB_STEP_SUMMARY"
          mkdir -p outputs
          python scripts/run_selection_campaign.py \
            --workdir "$G6_WORKDIR" \
            --episodes 20 \
            --first-seed "$first_seed" \
            --model models/smollm2 \
            --design magnitude_v2 \
            --analyse \
            --batch 7 2>&1 | tee "$G6_LOG"
      - name: Add measured replay summary
        if: always()
        run: |
          if [[ -f "$G6_WORKDIR/selection_result.json" ]]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          from pathlib import Path
          result = json.loads((Path(os.environ["G6_WORKDIR"]) / "selection_result.json").read_text())
          contrast = result.get("primary_minus_null", {})
          print(f"\n- Design SHA-256: `{result.get('design_sha256')}`")
          print(f"- Logged episodes: {result.get('episodes')}")
          print(f"- Decision: **{result.get('decision')}**")
          print(f"- Primary-minus-null median: {contrast.get('median_difference')}")
          print(f"- Exact p-value: {contrast.get('p_value')}")
          print(f"- Better / worse / ties: {contrast.get('episodes_primary_better')} / {contrast.get('episodes_null_better')} / {contrast.get('ties')}")
          print("\nThis is an offline selection-policy replay, not evidence of autonomous improvement or general capability.")
          PY
          else
            echo "\nNo complete replay result was produced; inspect the campaign log and partial evidence artifact." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: g6-magnitude-v2-evidence-${{ github.run_id }}
          path: |
            outputs/g6-model-receipt.json
            outputs/g6-magnitude-v2-campaign.log
            outputs/g6-magnitude-v2/selection_result.json
            outputs/g6-magnitude-v2/selection_design_predeclared.json
            outputs/g6-magnitude-v2/selection/selection_design_magnitude.json
            outputs/g6-magnitude-v2/experiments.sqlite3
            outputs/g6-magnitude-v2/episode-*/foundation.json
            outputs/g6-magnitude-v2/episode-*/manifest.json
            outputs/g6-magnitude-v2/runs/**/research.json
          if-no-files-found: warn
          retention-days: 90
